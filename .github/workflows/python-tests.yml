name: Python Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Syntax check
      run: |
        python -m py_compile sieve_l40s_hot_corridor.py
        python -m py_compile master_orchestrator.py
        python -m py_compile progression.py
        python -m py_compile sweep_100m.py
    - name: Import check
      run: |
        python -c "import sys; sys.path.insert(0, '.'); import atomic_writer; print('atomic_writer OK')"
        python -c "import sys; sys.path.insert(0, '.'); import sweep_100m; print('sweep_100m OK')"
    - name: Run pytest
      run: python -m pytest tests/ -x -v
    - name: Verify datasets
      run: python verify_datasets.py --results-dir results
